<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bella Italia — Cooking Idle Tycoon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            user-select: none;
            -webkit-user-select: none;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="flex flex-col h-screen justify-between">

    <!-- Header Section -->
    <header class="bg-stone-900 border-b border-stone-800 p-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-2">
            <span class="text-2xl">🍕</span>
            <div>
                <h1 class="font-bold text-lg text-amber-500">Bella Italia</h1>
                <p class="text-xs text-stone-400">Cooking Idle Tycoon</p>
            </div>
        </div>
        <div class="flex items-center space-x-3 bg-stone-800 px-3 py-1.5 rounded-full border border-stone-700">
            <span class="text-amber-400 font-bold text-sm" id="coinCount">0</span>
            <span class="text-xs text-amber-200">🪙</span>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto p-4 relative no-scrollbar" id="mainContainer">
        <!-- Kitchen Station View -->
        <div id="stationView" class="space-y-4">
            <div class="bg-stone-900 border border-stone-800 rounded-2xl p-6 text-center relative overflow-hidden shadow-lg">
                <div class="absolute inset-0 bg-amber-500/5 pointer-events-none"></div>
                <h2 class="text-sm uppercase tracking-wider text-stone-400 mb-1">Main Kitchen Station</h2>
                <div class="text-3xl font-extrabold text-amber-400 my-3" id="gpsDisplay">+0 / hr</div>
                
                <!-- Interactive Cooking Station -->
                <div class="my-6 flex justify-center">
                    <button id="stationBtn" class="w-32 h-32 rounded-full bg-gradient-to-br from-amber-500 to-orange-600 flex items-center justify-center text-5xl shadow-xl active:scale-95 transition-transform border-4 border-amber-300 focus:outline-none">
                        👨‍🍳
                    </button>
                </div>
                
                <!-- Energy / Progress Bar -->
                <div class="w-full bg-stone-800 h-3 rounded-full overflow-hidden border border-stone-700">
                    <div id="loadBar" class="bg-amber-500 h-full transition-all duration-100" style="width: 100%;"></div>
                </div>
                <div class="flex justify-between text-xs text-stone-400 mt-1">
                    <span>Energy / Action Buffer</span>
                    <span id="energyText">100 / 100</span>
                </div>
            </div>

            <!-- Staff & Upgrades Section -->
            <div class="bg-stone-900 border border-stone-800 rounded-2xl p-4 shadow-lg">
                <h3 class="font-bold text-md text-amber-400 mb-3 flex items-center justify-between">
                    <span>Kitchen Brigade</span>
                    <span class="text-xs text-stone-400 font-normal">Auto-Profit</span>
                </h3>
                <div id="staffList" class="space-y-3">
                    <!-- Dynamically rendered staff items -->
                </div>
            </div>

            <!-- Tasks Section -->
            <div class="bg-stone-900 border border-stone-800 rounded-2xl p-4 shadow-lg">
                <h3 class="font-bold text-md text-amber-400 mb-3">Daily Missions & Tasks</h3>
                <div id="tasksList" class="space-y-3">
                    <!-- Dynamically rendered tasks -->
                </div>
            </div>
        </div>
    </main>

    <!-- Navigation Footer -->
    <nav class="bg-stone-900 border-t border-stone-800 p-2 flex justify-around items-center">
        <button onclick="switchTab('kitchen')" class="flex flex-col items-center text-amber-500 p-2 focus:outline-none" id="navKitchen">
            <span class="text-xl">🍳</span>
            <span class="text-xs mt-1">Kitchen</span>
        </button>
        <button onclick="switchTab('staff')" class="flex flex-col items-center text-stone-400 p-2 focus:outline-none" id="navStaff">
            <span class="text-xl">👥</span>
            <span class="text-xs mt-1">Staff</span>
        </button>
        <button onclick="switchTab('tasks')" class="flex flex-col items-center text-stone-400 p-2 focus:outline-none" id="navTasks">
            <span class="text-xl">📋</span>
            <span class="text-xs mt-1">Tasks</span>
        </button>
        <button onclick="switchTab('friend')" class="flex flex-col items-center text-stone-400 p-2 focus:outline-none" id="navFriend">
            <span class="text-xl">🎁</span>
            <span class="text-xs mt-1">Invite</span>
        </button>
    </nav>

    <!-- JavaScript Application Logic -->
    <script>
        // Telegram WebApp Initialization
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Safe DOM Element Selector Helper
        const $ = (id) => document.getElementById(id);

        // Game State
        let gameState = {
            coins: 1000,
            gps: 0,
            energy: 100,
            maxEnergy: 100,
            lastSave: Date.now()
        };

        // Staff Data Definition
        const STAFF_DATA = [
            { id: 'chef_line', name: 'Line Cook', level: 0, cost: 50, gps: 5, icon: '🔪' },
            { id: 'sous_chef', name: 'Sous Chef', level: 0, cost: 250, gps: 25, icon: '🥘' },
            { id: 'head_chef', name: 'Master Chef', level: 0, cost: 1200, gps: 120, icon: '⭐' }
        ];

        // Tasks Data Definition
        const TASKS_DATA = [
            { id: 'checkin', title: 'Daily Check-in', reward: 100, completed: false },
            { id: 'invite_friend', title: 'Invite a Friend', reward: 500, completed: false }
        ];

        // Anti-Bot Tap Velocity Tracking (Threshold raised to 38 for multi-touch tolerance)
        let tapHistory = [];
        const MAX_TAP_VELOCITY = 38;

        // UI Update Helpers
        function fmt(val) {
            if (val >= 1e6) return (val / 1e6).toFixed(1) + 'M';
            if (val >= 1e3) return (val / 1e3).toFixed(1) + 'k';
            return Math.floor(val).toLocaleString();
        }

        function updateUI() {
            $("coinCount").innerText = fmt(gameState.coins);
            $("gpsDisplay").innerText = `+${fmt(gameState.gps)} / hr`;
            $("energyText").innerText = `${Math.floor(gameState.energy)} / ${gameState.maxEnergy}`;
            $("loadBar").style.width = `${(gameState.energy / gameState.maxEnergy) * 100}%`;
            
            renderStaff();
            renderTasks();
        }

        // Render Staff List with properly escaped template literals
        function renderStaff() {
            const container = $("staffList");
            if (!container) return;
            
            container.innerHTML = STAFF_DATA.map(x => `
                <div class="bg-stone-800/60 border border-stone-700/60 rounded-xl p-3 flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <span class="text-2xl">${x.icon}</span>
                        <div>
                            <h4 class="font-semibold text-sm text-stone-200">${x.name} (Lvl ${x.level})</h4>
                            <p class="text-xs text-amber-400">+${fmt(x.gps)} GPS each</p>
                        </div>
                    </div>
                    <button onclick="buyStaff('${x.id}')" class="bg-amber-500 hover:bg-amber-600 text-stone-950 font-bold px-3 py-1.5 rounded-lg text-xs transition-colors">
                        ${fmt(x.cost)} 🪙
                    </button>
                </div>
            `).join('');
        }

        // Render Tasks List
        function renderTasks() {
            const container = $("tasksList");
            if (!container) return;

            container.innerHTML = TASKS_DATA.map(t => `
                <div class="bg-stone-800/60 border border-stone-700/60 rounded-xl p-3 flex items-center justify-between">
                    <div>
                        <h4 class="font-semibold text-sm text-stone-200">${t.title}</h4>
                        <p class="text-xs text-amber-400">+${fmt(t.reward)} Coins</p>
                    </div>
                    <button onclick="completeTask('${t.id}')" ${t.completed ? 'disabled' : ''} class="${t.completed ? 'bg-stone-700 text-stone-500 cursor-not-allowed' : 'bg-amber-500 hover:bg-amber-600 text-stone-950'} font-bold px-3 py-1.5 rounded-lg text-xs transition-colors">
                        ${t.completed ? 'Completed' : 'Claim'}
                    </button>
                </div>
            `).join('');
        }

        // Action Handlers
        function buyStaff(id) {
            const staff = STAFF_DATA.find(s => s.id === id);
            if (!staff) return;

            if (gameState.coins >= staff.cost) {
                gameState.coins -= staff.cost;
                staff.level += 1;
                gameState.gps += staff.gps;
                staff.cost = Math.floor(staff.cost * 1.15);
                updateUI();
            } else {
                if (window.Telegram?.WebApp) {
                    Telegram.WebApp.showAlert("Not enough coins!");
                }
            }
        }

        function completeTask(id) {
            const task = TASKS_DATA.find(t => t.id === id);
            if (!task || task.completed) return;

            task.completed = true;
            gameState.coins += task.reward;
            updateUI();
        }

        // Tab Navigation
        function switchTab(tab) {
            ['kitchen', 'staff', 'tasks', 'friend'].forEach(t => {
                const navEl = $(`nav${t.charAt(0).toUpperCase() + t.slice(1)}`);
                if (navEl) {
                    navEl.classList.remove('text-amber-500');
                    navEl.classList.add('text-stone-400');
                }
            });

            const activeNav = $(`nav${tab.charAt(0).toUpperCase() + tab.slice(1)}`);
            if (activeNav) {
                activeNav.classList.remove('text-stone-400');
                activeNav.classList.add('text-amber-500');
            }

            // Simple view rendering based on tab selection
            const container = $("mainContainer");
            if (tab === 'friend') {
                const refCode = tg.initDataUnsafe?.user?.id || 'guest';
                const shareText = encodeURIComponent('Join my kitchen brigade in Idle Cooking Tycoon and get bonus coins!');
                const shareUrl = encodeURIComponent(`https://t.me/idle_cooking_tycoon_bot?start=${refCode}`);
                
                container.innerHTML = `
                    <div class="bg-stone-900 border border-stone-800 rounded-2xl p-6 text-center shadow-lg space-y-4">
                        <h2 class="text-lg font-bold text-amber-400">Invite Friends</h2>
                        <p class="text-xs text-stone-400">Get bonus coins and accelerator rewards when your friends join your kitchen brigade!</p>
                        <a href="https://t.me/share/url?url=${shareUrl}&text=${shareText}" target="_blank" class="block w-full bg-amber-500 hover:bg-amber-600 text-stone-950 font-bold py-3 rounded-xl text-sm transition-colors">
                            Share Invite Link 🚀
                        </a>
                    </div>
                `;
            } else {
                // Restore main station view or handle other tabs
                location.reload(); 
            }
        }

        // Tap Station Event Handler with Anti-Bot Protection
        const stationBtn = $("stationBtn");
        if (stationBtn) {
            stationBtn.addEventListener('pointerdown', (e) => {
                const now = Date.now();
                tapHistory = tapHistory.filter(time => now - time < 1000);
                tapHistory.push(now);

                if (tapHistory.length > MAX_TAP_VELOCITY) {
                    console.warn("Tap velocity threshold reached - possible automated input.");
                    return;
                }

                gameState.coins += 1 + Math.floor(gameState.gps / 100);
                updateUI();
            });
        }

        // Idle Profit Loop (Every second)
        setInterval(() => {
            const now = Date.now();
            const deltaSeconds = (now - gameState.lastSave) / 1000;
            gameState.lastSave = now;

            if (gameState.gps > 0) {
                gameState.coins += (gameState.gps / 3600) * deltaSeconds;
                updateUI();
            }

            if (gameState.energy < gameState.maxEnergy) {
                gameState.energy = Math.min(gameState.maxEnergy, gameState.energy + 2 * (deltaSeconds));
                updateUI();
            }
        }, 1000);

        // Initial Setup
        updateUI();
    </script>
</body>
</html>
